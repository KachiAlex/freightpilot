<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Freightpilot - Modern fleet management with compliant trip planning, FMCSA Hours-of-Service automation, and DOT log generation." />
    <meta name="theme-color" content="#0066FF" />
    <title>Freightpilot - Modern Fleet Management</title>

    <!-- Google Fonts: Inter and JetBrains Mono with font-display: swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Graceful degradation - basic styles for no-JS fallback */
      .no-js-warning {
        background: #fff3cd;
        border: 1px solid #ffc107;
        color: #856404;
        padding: 1rem;
        text-align: center;
        margin: 1rem;
        border-radius: 4px;
      }
      .basic-content {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
        line-height: 1.6;
      }
      .basic-content h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        color: #1F2937;
      }
      .basic-content p {
        margin-bottom: 1rem;
        color: #6B7280;
      }
      .basic-content a {
        color: #0066FF;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="no-js-warning">
        <strong>JavaScript is required for Freightpilot to function properly.</strong>
        Please enable JavaScript in your browser settings to continue.
      </div>
      <div class="basic-content">
        <h1>Freightpilot - Modern Fleet Management</h1>
        <p>Plan compliant miles with one intelligent workspace.</p>
        <p>End-to-end trip planning, FMCSA Hours-of-Service automation, and DOT log generation—built for high-performing fleets and solo drivers.</p>
        <p><a href="/auth/login">Sign in</a> or <a href="/auth/register">Create account</a></p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
